# ==============================================================================
# Phase 2 LSTM Configuration: Air Quality Forecasting
# Beijing Multi-Site Air Quality Dataset (UCI Machine Learning Repository)
# ==============================================================================

project:
  name: "Air Quality Forecasting via Gradient Boosting and LSTM Models"
  phase: 2
  target: "PM2.5"
  random_seed: 42

stations:
  all:
    - "Aotizhongxin"
    - "Changping"
    - "Dingling"
    - "Dongsi"
    - "Guanyuan"
    - "Gucheng"
    - "Huairou"
    - "Nongzhanguan"
    - "Shunyi"
    - "Tiantan"
    - "Wanliu"
    - "Wanshouxigong"
  default: "Aotizhongxin"

data:
  raw_dir: "data/raw"  # matches data/README.md (case matters on Linux)
  timestamp_column: "datetime"
  station_column: "station"
  target_column: "PM2.5"

cleaning:
  max_ffill_hours: 6
  encode_wind: true
  fill_remaining_with_median: true
  impute_target: false  # Target is strictly NEVER imputed

features:
  # Base pollutant concentrations at timestep t (µg/m³)
  pollutants:
    - "PM2.5"
    - "PM10"
    - "SO2"
    - "NO2"
    - "CO"
    - "O3"
  # Meteorological measurements at timestep t
  meteorology:
    - "TEMP"
    - "PRES"
    - "DEWP"
    - "RAIN"
    - "WSPM"
  # Continuous cyclical wind vector components
  wind:
    - "wd_sin"
    - "wd_cos"
  # Meteorological domain interaction features
  domain:
    - "temp_dewp_spread"
    - "wind_stagnation"
    - "rain_clearing"
  # Temporal and diurnal cyclical components
  temporal:
    - "sin_hour"
    - "cos_hour"
    - "sin_month"
    - "cos_month"
    - "sin_dow"
    - "cos_dow"

lstm_windows:
  # Historical input sequence windows W (hours)
  input_sequence_lengths:
    - 24
    - 48
    - 72
  default_sequence_length: 24

forecast_horizons:
  # Forecast horizons H (hours ahead)
  horizons:
    - 1
    - 3
    - 6
    - 12
    - 24
  default_horizon: 1

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  chronological: true
  embargo_hours: 0  # Configurable boundary embargo hours

scaling:
  scaler_type: "standard"  # "standard" (StandardScaler) or "minmax" (MinMaxScaler)
  scalers_dir: "models/phase2/scalers"
  save_scalers: true
  scale_target: true

model:
  lstm_units: 64
  lstm_layers: 1
  dropout_rate: 0.2
  dense_units: 32
  dense_activation: "relu"
  output_units: 5
  loss_function: "mae"  # "mae" or "huber"
  huber_delta: 1.0
  learning_rate: 0.001

training:
  batch_size: 32
  epochs: 50
  early_stopping_patience: 10
  reduce_lr_patience: 5
  reduce_lr_factor: 0.5
  min_lr: 0.00001
  checkpoint_dir: "models/phase2/checkpoints"
  history_dir: "reports/results/phase2/history"
  figures_dir: "reports/figures/phase2"
  save_artifacts: true

tuning:
  epochs_per_trial: 20
  early_stopping_patience: 5
  results_dir: "reports/results/phase2"

# ------------------------------------------------------------------------------
# Integration-level settings (read by src/phase2/experiment_manager.py; the
# module-level Phase2Config ignores these sections).
# ------------------------------------------------------------------------------
experiment:
  output_root: "experiments/phase2_runs"   # every run -> <output_root>/<run_id>/
  run_name: "phase2"                       # run_id = <run_name>_<UTC time>_<config hash>
  window_size: null                        # null -> lstm_windows.default_sequence_length
  primary_station: null                    # null -> stations.default (used for example figures)

evaluation:
  partition: "test"                        # final reporting partition; never used for selection
  batch_size: 64
  prediction_atol: 0.0001                  # saved vs. re-computed prediction tolerance (ug/m3)

reproducibility:
  deterministic_ops: false                 # true -> tf.config.experimental.enable_op_determinism()
  hash_raw_data: true                      # record SHA-256 of raw CSVs in manifest.json
